<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Future Interface</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(-45deg, rgb(15, 23, 42), rgb(30, 41, 59), rgb(30, 27, 75), rgb(15, 23, 42));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Modal Setup */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            color: white;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .modal-content p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .modal-content input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 0.9rem;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .modal-content input:focus {
            border-color: rgb(99, 102, 241);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        .modal-content input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-save {
            background: linear-gradient(135deg, rgb(99, 102, 241), rgb(168, 85, 247));
            color: white;
        }

        .btn-save:hover {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Chat Container */
        .chat-container {
            width: 90%;
            max-width: 450px;
            height: 80vh;
            max-height: 700px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .chat-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
        }

        .chat-header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
        }

        .chat-header h1 {
            font-size: 1.2rem;
            color: white;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: rgb(34, 197, 94);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px rgb(34, 197, 94);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgb(99, 102, 241);
        }

        .clear-btn:hover {
            background: rgba(255, 59, 48, 0.2);
            border-color: rgb(255, 59, 48);
            color: rgb(255, 100, 100);
        }

        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: linear-gradient(135deg, rgb(99, 102, 241), rgb(168, 85, 247));
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        .ai {
            background: rgba(255, 255, 255, 0.1);
            color: rgb(226, 232, 240);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-input {
            display: flex;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            gap: 10px;
        }

        input.chat-input-field {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input.chat-input-field:focus {
            border-color: rgb(99, 102, 241);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        input.chat-input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        button.send-btn {
            padding: 0 20px;
            border: none;
            background: linear-gradient(135deg, rgb(99, 102, 241), rgb(168, 85, 247));
            color: white;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.send-btn:hover {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        button.send-btn:active {
            transform: scale(0.95);
        }
        
        button.send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }
    </style>
</head>
<body>

<!-- Setup Modal -->
<div id="setupModal" class="modal show">
    <div class="modal-content">
        <h2>🔑 Налаштування API</h2>
        <p>Введіть ваш OpenRouter API-ключ для розпочати роботу з чатом</p>
        <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." />
        <p style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.5);">
            Отримати ключ: <a href="https://openrouter.ai" target="_blank" style="color: rgb(99, 102, 241); text-decoration: none;">openrouter.ai</a>
        </p>
        <div class="modal-buttons">
            <button class="btn-save" onclick="saveApiKey()">Зберегти</button>
        </div>
    </div>
</div>

<!-- Chat Container -->
<div class="chat-container">
    <div class="chat-header">
        <div class="header-content">
            <span class="status-dot"></span>
            <h1>Nexus AI</h1>
        </div>
        <div class="header-buttons">
            <button class="header-btn" onclick="showSettings()" title="Налаштування">⚙️</button>
            <button class="header-btn clear-btn" onclick="clearChat()" title="Очистити чат">🗑️</button>
        </div>
    </div>
    <div class="chat-messages" id="messages">
        <div class="message ai">Привіт! Я Nexus AI. Готовий до твоїх запитань. Напиши щось цікаве!</div>
    </div>
    <div class="chat-input">
        <input type="text" id="userInput" class="chat-input-field" placeholder="Запитай мене про щось... (Enter для відправки)" onkeypress="handleKeyPress(event)">
        <button type="button" class="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </div>
</div>

<script>
    const inputField = document.getElementById('userInput');
    const messagesContainer = document.getElementById('messages');
    const setupModal = document.getElementById('setupModal');
    const apiKeyInput = document.getElementById('apiKeyInput');

    // Завантаження API-ключа з localStorage
    function loadApiKey() {
        const savedKey = localStorage.getItem('openrouter_api_key');
        if (savedKey) {
            setupModal.classList.remove('show');
            return savedKey;
        }
        return null;
    }

    // Збереження API-ключа
    function saveApiKey() {
        const key = apiKeyInput.value.trim();
        if (!key) {
            alert('Будь ласка, введіть API-ключ');
            return;
        }
        if (!key.startsWith('sk-or-v1-')) {
            alert('Невірний формат API-ключа. Він повинен починатися з sk-or-v1-');
            return;
        }
        localStorage.setItem('openrouter_api_key', key);
        setupModal.classList.remove('show');
        inputField.focus();
    }

    // Показування налаштувань
    function showSettings() {
        apiKeyInput.value = localStorage.getItem('openrouter_api_key') || '';
        setupModal.classList.add('show');
    }

    // Enter для збереження ключа
    apiKeyInput.addEventListener('keypress', (event) => {
        if (event.key === 'Enter') {
            saveApiKey();
        }
    });

    function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;

        const API_KEY = localStorage.getItem('openrouter_api_key');
        if (!API_KEY) {
            showSettings();
            return;
        }

        appendMessage(text, 'user');
        inputField.value = '';

        const typingId = showTypingIndicator();

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`,
                    "HTTP-Referer": window.location.href
                },
                body: JSON.stringify({
                    model: "openrouter/auto",
                    messages: [
                        { role: "system", content: "Ти корисний асистент. Відповідай українською мовою." },
                        { role: "user", content: text }
                    ]
                })
            });

            const data = await response.json();
            removeTypingIndicator(typingId);

            if (data.choices && data.choices[0].message) {
                appendMessage(data.choices[0].message.content, 'ai');
            } else if (data.error) {
                appendMessage(`Помилка API: ${data.error.message}`, 'ai');
            } else {
                appendMessage("Не вдалося отримати відповідь.", 'ai');
            }

        } catch (error) {
            removeTypingIndicator(typingId);
            appendMessage(`Помилка мережі: ${error.message}`, 'ai');
            console.error(error);
        }
    }

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.textContent = text;
        messagesContainer.appendChild(msgDiv);
        scrollToBottom();
    }

    function showTypingIndicator() {
        const id = Date.now();
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message ai typing-indicator';
        typingDiv.id = id;
        typingDiv.innerHTML = '<span style="opacity: 0.5">думаю...</span>';
        messagesContainer.appendChild(typingDiv);
        scrollToBottom();
        return id;
    }

    function removeTypingIndicator(id) {
        const indicator = document.getElementById(id);
        if (indicator) indicator.remove();
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        setTimeout(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 100);
    }

    function clearChat() {
        if (confirm('Ви впевнені? Це видалить всю історію чату.')) {
            messagesContainer.innerHTML = '<div class="message ai">Привіт! Я Nexus AI. Готовий до твоїх запитань. Напиши щось цікаве!</div>';
            inputField.value = '';
            inputField.focus();
        }
    }

    // Ініціалізація при завантаженні
    window.addEventListener('load', () => {
        if (!loadApiKey()) {
            setupModal.classList.add('show');
            apiKeyInput.focus();
        } else {
            inputField.focus();
        }
    });
</script>

</body>
</html>
