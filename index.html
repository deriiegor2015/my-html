<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Free & Vision</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif; }
        body {
            height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #1e1b4b, #0f172a);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: white;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .app-container {
            width: 98%; max-width: 1200px; height: 92vh; display: flex;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .sidebar {
            width: 260px; background: rgba(0, 0, 0, 0.4); border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; padding: 15px; gap: 15px;
        }
        .new-chat-btn {
            padding: 12px; background: linear-gradient(135deg, #6366f1, #a855f7); border: none;
            border-radius: 12px; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .chats-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-item {
            padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); cursor: pointer;
            font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; transition: all 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-item:hover, .chat-item.active { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
        .chat-title-text { overflow: hidden; text-overflow: ellipsis; }
        .delete-chat-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.8rem; display: none; }
        .chat-item:hover .delete-chat-btn { display: inline; }

        .user-profile { padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }

        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .chat-header {
            padding: 15px 20px; background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        .message { padding: 14px 18px; border-radius: 18px; max-width: 85%; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
        .user { background: linear-gradient(135deg, #6366f1, #a855f7); align-self: flex-end; color: white; }
        .ai { background: rgba(255, 255, 255, 0.08); align-self: flex-start; border: 1px solid rgba(255, 255, 255, 0.05); color: #e2e8f0; }

        .preview-img { max-width: 140px; max-height: 140px; border-radius: 10px; object-fit: cover; margin-top: 8px; border: 1px solid rgba(255,255,255,0.2); }

        pre { background: #090d16; padding: 12px; border-radius: 10px; overflow-x: auto; margin-top: 8px; border: 1px solid rgba(255,255,255,0.1); }
        code { font-family: monospace; font-size: 0.85rem; color: #38bdf8; }

        .chat-input-area { padding: 12px 16px; background: rgba(0, 0, 0, 0.2); border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 8px; }
        .file-attachment-bar { display: flex; gap: 10px; align-items: center; font-size: 0.85rem; color: #a1a1aa; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 8px; }
        .input-row { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; outline: none; font-size: 0.95rem; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 12px; background: #6366f1; color: white; cursor: pointer; font-weight: bold; }
        .btn-file { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal.show { display: flex; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 20px; width: 90%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.1); }
        select, input[type="password"], input[type="text"].modal-input { padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; font-size: 0.9rem; width: 100%; }
        
        .badge-device { font-size: 0.7rem; background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; color: #a1a1aa; }
        a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">➕ Новий чат</button>
        <div class="chats-list" id="chatsList"></div>
        <div class="user-profile">
            <div>
                <span>📱 Безкоштовний режим</span>
                <br><span class="badge-device">Gemini 1.5 Flash</span>
            </div>
        </div>
    </div>

    <div class="chat-main">
        <div class="chat-header">
            <h3 id="currentChatTitle">💬 Чат</h3>
            <button class="btn btn-file" onclick="openSettings()">⚙️ Налаштування API</button>
        </div>

        <div class="chat-messages" id="messages"></div>

        <div class="chat-input-area">
            <div id="filePreview" class="file-attachment-bar" style="display: none;">
                <span id="fileName">Файл прикріплено</span>
                <button onclick="clearAttachedFile()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">✕</button>
            </div>
            <div class="input-row">
                <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
                <button class="btn btn-file" onclick="document.getElementById('fileInput').click()" title="Прикріпити фото чи файл">📎</button>
                <input type="text" id="userInput" placeholder="Напишіть запит або прикріпіть фото..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>⚙️ Налаштування Gemini Key</h3>
        
        <label style="font-size: 0.85rem; color: #a1a1aa;">Google Gemini API Key (починається з AIzaSy):</label>
        <input type="password" id="geminiKeyInput" placeholder="AIzaSy...">
        <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 4px;">
            🔑 Отримати безкоштовно без картки: <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>
        </p>

        <button class="btn" style="margin-top: 10px;" onclick="saveSettings()">Зберегти</button>
    </div>
</div>

<script>
    let chats = [];
    let currentChatId = null;
    let attachedFile = null;

    window.onload = () => {
        loadSettings();
        loadUserChats();
    };

    function loadUserChats() {
        try {
            const savedChats = localStorage.getItem('nexus_chats_free');
            chats = savedChats ? JSON.parse(savedChats) : [];
        } catch(e) {
            chats = [];
        }
        if (chats.length === 0) {
            createNewChat();
        } else {
            selectChat(chats[0].id);
        }
    }

    function saveUserChats() {
        localStorage.setItem('nexus_chats_free', JSON.stringify(chats));
        renderChatsList();
    }

    function createNewChat() {
        const newChat = {
            id: 'chat_' + Date.now(),
            title: 'Новий чат',
            messages: [{ role: 'ai', content: 'Привіт! Я підтримую **Vision** (роботу з фото). Вкажіть API Key у налаштуваннях (⚙️), прикріпіть фото чи файл і запитуйте.' }]
        };
        chats.unshift(newChat);
        saveUserChats();
        selectChat(newChat.id);
    }

    function selectChat(chatId) {
        currentChatId = chatId;
        renderChatsList();
        renderMessages();
    }

    function deleteChat(chatId, event) {
        event.stopPropagation();
        chats = chats.filter(c => c.id !== chatId);
        if (chats.length === 0) {
            createNewChat();
        } else {
            saveUserChats();
            selectChat(chats[0].id);
        }
    }

    function renderChatsList() {
        const listEl = document.getElementById('chatsList');
        listEl.innerHTML = '';
        chats.forEach(chat => {
            const item = document.createElement('div');
            item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'chat-title-text';
            titleSpan.innerText = chat.title;
            
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-chat-btn';
            delBtn.innerText = '🗑️';
            delBtn.onclick = (e) => deleteChat(chat.id, e);

            item.appendChild(titleSpan);
            item.appendChild(delBtn);
            item.onclick = () => selectChat(chat.id);
            listEl.appendChild(item);
        });
    }

    function renderMessages() {
        const chat = chats.find(c => c.id === currentChatId);
        if (!chat) return;

        document.getElementById('currentChatTitle').innerText = `💬 ${chat.title}`;
        const msgContainer = document.getElementById('messages');
        msgContainer.innerHTML = '';

        chat.messages.forEach(msg => {
            appendMessageHTML(msg.content, msg.role);
        });
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('show'); }
    function loadSettings() {
        document.getElementById('geminiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    }

    function saveSettings() {
        const key = document.getElementById('geminiKeyInput').value.trim();
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('settingsModal').classList.remove('show');
    }

    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const isImage = file.type.startsWith('image/');

        reader.onload = function(evt) {
            const rawResult = evt.target.result;
            if (isImage) {
                attachedFile = { name: file.name, type: file.type || 'image/jpeg', content: rawResult, isImage: true };
                showFilePreview(`🖼️ Фото: ${file.name}`);
            } else {
                attachedFile = { name: file.name, type: file.type || 'text/plain', content: rawResult, isImage: false };
                showFilePreview(`📄 Файл: ${file.name}`);
            }
        };

        if (isImage) {
            reader.readAsDataURL(file);
        } else {
            reader.readAsText(file);
        }
    }

    function showFilePreview(text) {
        document.getElementById('fileName').innerText = text;
        document.getElementById('filePreview').style.display = 'flex';
    }

    function clearAttachedFile() {
        attachedFile = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('filePreview').style.display = 'none';
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const prompt = input.value.trim();
        if (!prompt && !attachedFile) return;

        const activeChat = chats.find(c => c.id === currentChatId);
        if (!activeChat) return;

        if (activeChat.messages.length <= 1 && prompt) {
            activeChat.title = prompt.substring(0, 20) + '...';
        }

        let userContent = prompt;
        if (attachedFile) {
            userContent += attachedFile.isImage 
                ? `<br><img src="${attachedFile.content}" class="preview-img">` 
                : `<br><i>[Файл: <b>${attachedFile.name}</b>]</i>`;
        }

        activeChat.messages.push({ role: 'user', content: userContent });
        appendMessageHTML(userContent, 'user');

        input.value = '';
        const currentFile = attachedFile;
        clearAttachedFile();
        saveUserChats();

        const loadingText = "<i>🔍 Обробляю запит...</i>";
        activeChat.messages.push({ role: 'ai', content: loadingText });
        const msgId = appendMessageHTML(loadingText, 'ai');

        try {
            const responseText = await callGeminiAPI(prompt, currentFile);
            const formatted = formatAIResponse(responseText);
            activeChat.messages[activeChat.messages.length - 1].content = formatted;
            updateMessageHTML(msgId, formatted);
            saveUserChats();
        } catch (err) {
            const errText = `❌ Помилка: ${err.message}`;
            activeChat.messages[activeChat.messages.length - 1].content = errText;
            updateMessageHTML(msgId, errText);
            saveUserChats();
        }
    }

    // Google Gemini API з точним ендпоінтом gemini-1.5-flash
    async function callGeminiAPI(prompt, file) {
        const apiKey = localStorage.getItem('gemini_api_key');
        if (!apiKey || !apiKey.startsWith('AIzaSy')) {
            throw new Error("Невірно вказано API Key! Переконайся, що він починається на 'AIzaSy' у налаштуваннях (⚙️).");
        }

        let parts = [];
        let textPart = prompt || "Проаналізуй вміст.";

        if (file && !file.isImage) {
            textPart += `\n\n--- ФАЙЛ (${file.name}) ---\n${file.content}`;
        }

        parts.push({ text: textPart });

        if (file && file.isImage && file.content) {
            const splitData = file.content.split(',');
            if (splitData.length > 1) {
                const base64Data = splitData[1];
                const mimeType = file.type || 'image/jpeg';
                parts.push({
                    inline_data: {
                        mime_type: mimeType,
                        data: base64Data
                    }
                });
            }
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;

        const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: parts }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message || "Помилка API");

        if (!data.candidates || !data.candidates[0]?.content?.parts[0]?.text) {
            throw new Error("Не вдалося отримати відповідь від Gemini.");
        }

        return data.candidates[0].content.parts[0].text;
    }

    function formatAIResponse(text) {
        let parsed = text;
        parsed = parsed.replace(/```([a-zA-Z0-9_]*)\n([\s\S]*?)```/g, (m, lang, code) => {
            return `<pre><code>${code.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>`;
        });
        return parsed.replace(/\n/g, '<br>');
    }

    function appendMessageHTML(content, sender) {
        const id = 'msg_' + Date.now() + Math.random();
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.id = id;
        div.innerHTML = content;
        const msgContainer = document.getElementById('messages');
        msgContainer.appendChild(div);
        msgContainer.scrollTop = msgContainer.scrollHeight;
        return id;
    }

    function updateMessageHTML(id, content) {
        const el = document.getElementById(id);
        if (el) el.innerHTML = content;
    }
</script>

</body>
</html>
