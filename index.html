<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Hybrid Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif; }
        body {
            height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #1e1b4b, #0f172a);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: white;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Main App Layout */
        .app-container {
            width: 98%; max-width: 1200px; height: 92vh; display: flex;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Sidebar */
        .sidebar {
            width: 260px; background: rgba(0, 0, 0, 0.4); border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; padding: 15px; gap: 15px;
        }
        .new-chat-btn {
            padding: 12px; background: linear-gradient(135deg, #6366f1, #a855f7); border: none;
            border-radius: 12px; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .chats-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-item {
            padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); cursor: pointer;
            font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; transition: all 0.2s;
        }
        .chat-item:hover, .chat-item.active { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
        .user-profile { padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }

        /* Main Chat Area */
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .chat-header {
            padding: 15px 20px; background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        /* Messages Elements */
        .message { padding: 14px 18px; border-radius: 18px; max-width: 85%; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
        .user { background: linear-gradient(135deg, #6366f1, #a855f7); align-self: flex-end; color: white; }
        .ai { background: rgba(255, 255, 255, 0.08); align-self: flex-start; border: 1px solid rgba(255, 255, 255, 0.05); color: #e2e8f0; }

        .verdict-card { padding: 10px 14px; border-radius: 10px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .verdict-safe { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; }
        .verdict-warning { background: rgba(234, 179, 8, 0.2); border: 1px solid #eab308; color: #fde047; }
        .verdict-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }

        .preview-img { max-width: 140px; max-height: 140px; border-radius: 10px; object-fit: cover; margin-top: 8px; border: 1px solid rgba(255,255,255,0.2); }
        .generated-video { width: 100%; max-width: 450px; border-radius: 12px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.2); }

        pre { background: #090d16; padding: 12px; border-radius: 10px; overflow-x: auto; margin-top: 8px; border: 1px solid rgba(255,255,255,0.1); }
        code { font-family: monospace; font-size: 0.85rem; color: #38bdf8; }
        .download-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 12px; background: #22c55e; color: white; font-weight: 600; border-radius: 8px; text-decoration: none; font-size: 0.8rem; border: none; cursor: pointer; }

        /* Input Controls */
        .chat-input-area { padding: 12px 16px; background: rgba(0, 0, 0, 0.2); border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 8px; }
        .file-attachment-bar { display: flex; gap: 10px; align-items: center; font-size: 0.85rem; color: #a1a1aa; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 8px; }
        .input-row { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; outline: none; font-size: 0.95rem; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 12px; background: #6366f1; color: white; cursor: pointer; font-weight: bold; }
        .btn-file { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal.show { display: flex; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 20px; width: 90%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.1); }
        select, input[type="password"], input[type="text"].modal-input { padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; font-size: 0.9rem; width: 100%; }
        
        .badge-device { font-size: 0.7rem; background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; color: #a1a1aa; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">➕ Новий чат</button>
        <div class="chats-list" id="chatsList"></div>
        <div class="user-profile">
            <div>
                <span id="displayUser">📱 Гостьовий режим</span>
                <br><span class="badge-device" id="storageNotice">Збережено на пристрої</span>
            </div>
            <button class="btn btn-file" style="padding: 6px 10px; font-size:0.75rem;" id="authActionBtn" onclick="openAuthModal()">Вхід</button>
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-main">
        <div class="chat-header">
            <h3 id="currentChatTitle">💬 Чат</h3>
            <button class="btn btn-file" onclick="openSettings()">⚙️ Налаштування</button>
        </div>

        <div class="chat-messages" id="messages"></div>

        <div class="chat-input-area">
            <div id="filePreview" class="file-attachment-bar" style="display: none;">
                <span id="fileName">Файл прикріплено</span>
                <button onclick="clearAttachedFile()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">✕</button>
            </div>
            <div class="input-row">
                <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
                <button class="btn btn-file" onclick="document.getElementById('fileInput').click()" title="Прикріпити файл">📎</button>
                <input type="text" id="userInput" placeholder="Напишіть запит або 'Згенеруй відео неонове місто'..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальне вікно авторизації -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <h3 id="authTitle">Увійти в акаунт</h3>
        <p style="font-size: 0.8rem; color: #a1a1aa;">Увійдіть, щоб ізолювати чати від гостьового сеансу.</p>
        <form onsubmit="handleAuth(event)" style="display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="authUsername" class="modal-input" placeholder="Логін" required>
            <input type="password" id="authPassword" class="modal-input" placeholder="Пароль" required>
            <button type="submit" class="btn" id="authBtn">Увійти</button>
        </form>
        <button class="btn btn-file" onclick="closeAuthModal()">Закрити</button>
    </div>
</div>

<!-- Модальне вікно налаштувань -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>⚙️ Налаштування API</h3>
        
        <label style="font-size: 0.85rem; color: #a1a1aa;">AI Провайдер:</label>
        <select id="apiProvider" onchange="toggleProviderSettings()">
            <option value="openrouter">OpenRouter (Хмара)</option>
            <option value="ollama">Ollama (Локально)</option>
        </select>

        <div id="openrouterGroup">
            <label style="font-size: 0.85rem; color: #a1a1aa;">OpenRouter API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="sk-or-v1-...">
        </div>

        <div id="ollamaGroup" style="display: none;">
            <label style="font-size: 0.85rem; color: #a1a1aa;">Ollama URL:</label>
            <input type="text" class="modal-input" id="ollamaUrlInput" value="http://localhost:11434">
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 5px 0;">

        <label style="font-size: 0.85rem; color: #a1a1aa;">Replicate API Key (Відео):</label>
        <input type="password" id="replicateKeyInput" placeholder="r8_...">

        <button class="btn" style="margin-top: 10px;" onclick="saveSettings()">Зберегти</button>
    </div>
</div>

<script>
    let currentUser = localStorage.getItem('nexus_current_user') || null;
    let chats = [];
    let currentChatId = null;
    let attachedFile = null;

    window.onload = () => {
        updateUserStatus();
        loadSettings();
        loadUserChats();
    };

    // --- Управління статусом користувача ---
    function updateUserStatus() {
        if (currentUser) {
            document.getElementById('displayUser').innerText = `👤 ${currentUser}`;
            document.getElementById('storageNotice').innerText = 'Акаунт (Локально)';
            document.getElementById('authActionBtn').innerText = 'Вийти';
            document.getElementById('authActionBtn').onclick = logout;
        } else {
            document.getElementById('displayUser').innerText = '📱 Гостевий режим';
            document.getElementById('storageNotice').innerText = 'Збережено на пристрої';
            document.getElementById('authActionBtn').innerText = 'Вхід';
            document.getElementById('authActionBtn').onclick = openAuthModal;
        }
    }

    function openAuthModal() { document.getElementById('authModal').classList.add('show'); }
    function closeAuthModal() { document.getElementById('authModal').classList.remove('show'); }

    function handleAuth(e) {
        e.preventDefault();
        const username = document.getElementById('authUsername').value.trim();
        if (!username) return;

        currentUser = username;
        localStorage.setItem('nexus_current_user', currentUser);
        updateUserStatus();
        closeAuthModal();
        loadUserChats();
    }

    function logout() {
        localStorage.removeItem('nexus_current_user');
        currentUser = null;
        updateUserStatus();
        loadUserChats();
    }

    // --- Управління чатами (Збереження у localStorage) ---
    function getStorageKey() {
        return currentUser ? `nexus_chats_user_${currentUser}` : 'nexus_chats_guest';
    }

    function loadUserChats() {
        const savedChats = localStorage.getItem(getStorageKey());
        chats = savedChats ? JSON.parse(savedChats) : [];
        
        if (chats.length === 0) {
            createNewChat();
        } else {
            selectChat(chats[0].id);
        }
    }

    function saveUserChats() {
        localStorage.setItem(getStorageKey(), JSON.stringify(chats));
        renderChatsList();
    }

    function createNewChat() {
        const newChat = {
            id: 'chat_' + Date.now(),
            title: 'Новий чат',
            messages: [{ role: 'ai', content: 'Привіт! Чат готовий до роботи. Всі дані зберігаються на цьому пристрої.' }]
        };
        chats.unshift(newChat);
        saveUserChats();
        selectChat(newChat.id);
    }

    function selectChat(chatId) {
        currentChatId = chatId;
        renderChatsList();
        renderMessages();
    }

    function renderChatsList() {
        const listEl = document.getElementById('chatsList');
        listEl.innerHTML = '';
        chats.forEach(chat => {
            const item = document.createElement('div');
            item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
            item.innerText = chat.title;
            item.onclick = () => selectChat(chat.id);
            listEl.appendChild(item);
        });
    }

    function renderMessages() {
        const chat = chats.find(c => c.id === currentChatId);
        if (!chat) return;

        document.getElementById('currentChatTitle').innerText = `💬 ${chat.title}`;
        const msgContainer = document.getElementById('messages');
        msgContainer.innerHTML = '';

        chat.messages.forEach(msg => {
            appendMessageHTML(msg.content, msg.role);
        });
    }

    // --- Налаштування ---
    function openSettings() { document.getElementById('settingsModal').classList.add('show'); }
    function loadSettings() {
        document.getElementById('apiKeyInput').value = localStorage.getItem('api_key') || '';
        document.getElementById('replicateKeyInput').value = localStorage.getItem('replicate_key') || '';
        document.getElementById('apiProvider').value = localStorage.getItem('api_provider') || 'openrouter';
        document.getElementById('ollamaUrlInput').value = localStorage.getItem('ollama_url') || 'http://localhost:11434';
        toggleProviderSettings();
    }

    function saveSettings() {
        localStorage.setItem('api_key', document.getElementById('apiKeyInput').value.trim());
        localStorage.setItem('replicate_key', document.getElementById('replicateKeyInput').value.trim());
        localStorage.setItem('api_provider', document.getElementById('apiProvider').value);
        localStorage.setItem('ollama_url', document.getElementById('ollamaUrlInput').value.trim());
        document.getElementById('settingsModal').classList.remove('show');
    }

    function toggleProviderSettings() {
        const provider = document.getElementById('apiProvider').value;
        document.getElementById('openrouterGroup').style.display = provider === 'openrouter' ? 'block' : 'none';
        document.getElementById('ollamaGroup').style.display = provider === 'ollama' ? 'block' : 'none';
    }

    // --- Обробка файлів ---
    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const isImage = file.type.startsWith('image/');

        if (isImage) {
            reader.readAsDataURL(file);
            reader.onload = () => {
                attachedFile = { name: file.name, type: file.type, content: reader.result, isImage: true };
                showFilePreview(`🖼️ ${file.name}`);
            };
        } else {
            reader.readAsText(file);
            reader.onload = () => {
                attachedFile = { name: file.name, type: file.type, content: reader.result, isImage: false };
                showFilePreview(`📄 ${file.name}`);
            };
        }
    }

    function showFilePreview(text) {
        document.getElementById('fileName').innerText = text;
        document.getElementById('filePreview').style.display = 'flex';
    }

    function clearAttachedFile() {
        attachedFile = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('filePreview').style.display = 'none';
    }

    // --- Чат та API ---
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const prompt = input.value.trim();
        if (!prompt && !attachedFile) return;

        const activeChat = chats.find(c => c.id === currentChatId);
        if (!activeChat) return;

        if (activeChat.messages.length <= 1 && prompt) {
            activeChat.title = prompt.substring(0, 20) + '...';
        }

        let userContent = prompt;
        if (attachedFile) {
            userContent += attachedFile.isImage 
                ? `<br><img src="${attachedFile.content}" class="preview-img">` 
                : `<br><i>[Файл: <b>${attachedFile.name}</b>]</i>`;
        }

        activeChat.messages.push({ role: 'user', content: userContent });
        appendMessageHTML(userContent, 'user');

        input.value = '';
        const currentFile = attachedFile;
        clearAttachedFile();
        saveUserChats();

        const isVideoReq = prompt.toLowerCase().startsWith('згенеруй відео') || prompt.toLowerCase().includes('generate video');

        if (isVideoReq) {
            const videoPrompt = prompt.replace(/згенеруй відео:?/i, '').replace(/generate video:?/i, '').trim();
            const loadingMsg = "🎬 <i>Генерую відео через Replicate... Зачекайте хвилину...</i>";
            
            activeChat.messages.push({ role: 'ai', content: loadingMsg });
            const msgId = appendMessageHTML(loadingMsg, 'ai');

            try {
                const videoUrl = await generateVideoAPI(videoPrompt);
                const finalHTML = `✨ <b>Відео згенеровано!</b><br><video class="generated-video" controls autoplay loop muted src="${videoUrl}"></video><br><a class="download-btn" href="${videoUrl}" target="_blank" download="video.mp4">💾 Завантажити MP4</a>`;
                
                activeChat.messages[activeChat.messages.length - 1].content = finalHTML;
                updateMessageHTML(msgId, finalHTML);
                saveUserChats();
            } catch (err) {
                const errHTML = `❌ Помилка відео: ${err.message}`;
                activeChat.messages[activeChat.messages.length - 1].content = errHTML;
                updateMessageHTML(msgId, errHTML);
                saveUserChats();
            }
            return;
        }

        const loadingText = "<i>🔍 Обробляю запит...</i>";
        activeChat.messages.push({ role: 'ai', content: loadingText });
        const msgId = appendMessageHTML(loadingText, 'ai');

        try {
            const provider = localStorage.getItem('api_provider') || 'openrouter';
            const responseText = provider === 'openrouter' 
                ? await callOpenRouter(prompt, currentFile) 
                : await callOllama(prompt, currentFile);

            const formatted = formatAIResponse(responseText);
            activeChat.messages[activeChat.messages.length - 1].content = formatted;
            updateMessageHTML(msgId, formatted);
            saveUserChats();
        } catch (err) {
            const errText = `❌ Помилка: ${err.message}`;
            activeChat.messages[activeChat.messages.length - 1].content = errText;
            updateMessageHTML(msgId, errText);
            saveUserChats();
        }
    }

    async function generateVideoAPI(prompt) {
        const token = localStorage.getItem('replicate_key');
        if (!token) throw new Error("Укажіть Replicate API Key у налаштуваннях!");

        const res = await fetch("https://api.replicate.com/v1/predictions", {
            method: "POST",
            headers: { "Authorization": `Token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                version: "9f747673945c62801b13b84701c783929c0eed21e42dd46d7ec0db0afe781c21",
                input: { prompt }
            })
        });

        let prediction = await res.json();
        if (prediction.error) throw new Error(prediction.error);

        while (prediction.status !== 'succeeded' && prediction.status !== 'failed') {
            await new Promise(r => setTimeout(r, 3000));
            const check = await fetch(`https://api.replicate.com/v1/predictions/${prediction.id}`, {
                headers: { "Authorization": `Token ${token}` }
            });
            prediction = await check.json();
        }

        if (prediction.status === 'failed') throw new Error("Генерація не вдалася.");
        return Array.isArray(prediction.output) ? prediction.output[0] : prediction.output;
    }

    async function callOpenRouter(prompt, file) {
        const apiKey = localStorage.getItem('api_key');
        if (!apiKey) throw new Error("Укажіть OpenRouter API Key!");

        let text = prompt || "Проаналізуй вміст.";
        if (file && !file.isImage) text += `\n\n\`\`\`\n${file.content}\n\`\`\``;

        let payload = [{ type: "text", text: text }];
        if (file && file.isImage) payload.push({ type: "image_url", image_url: { url: file.content } });

        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
            body: JSON.stringify({
                model: "google/gemini-2.5-flash",
                messages: [{ role: "system", content: "Ти асистент з безпеки та аналізу коду. Додавай [VERDICT: SAFE], [VERDICT: SUSPICIOUS] або [VERDICT: MALICIOUS] якщо аналізуєш код/файл." }, { role: "user", content: payload }]
            })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        return data.choices[0].message.content;
    }

    async function callOllama(prompt, file) {
        const url = localStorage.getItem('ollama_url') || 'http://localhost:11434';
        let text = prompt || "Проаналізуй.";
        if (file && !file.isImage) text += `\n\`\`\`\n${file.content}\n\`\`\``;

        const res = await fetch(`${url}/api/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama3.2-vision",
                messages: [{ role: "user", content: text }],
                stream: false
            })
        });
        const data = await res.json();
        return data.message.content;
    }

    function formatAIResponse(text) {
        let parsed = text;
        if (parsed.includes('[VERDICT: SAFE]')) parsed = parsed.replace('[VERDICT: SAFE]', '<div class="verdict-card verdict-safe">🟢 БЕЗПЕЧНО</div>');
        if (parsed.includes('[VERDICT: SUSPICIOUS]')) parsed = parsed.replace('[VERDICT: SUSPICIOUS]', '<div class="verdict-card verdict-warning">🟡 ПІДОЗРІЛО</div>');
        if (parsed.includes('[VERDICT: MALICIOUS]')) parsed = parsed.replace('[VERDICT: MALICIOUS]', '<div class="verdict-card verdict-danger">🔴 ШКІДЛИВИЙ КОД</div>');

        parsed = parsed.replace(/```([a-zA-Z0-9_]*)\n([\s\S]*?)```/g, (m, lang, code) => {
            return `<pre><code>${code.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>`;
        });

        return parsed.replace(/\n/g, '<br>');
    }

    function appendMessageHTML(content, sender) {
        const id = 'msg_' + Date.now() + Math.random();
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.id = id;
        div.innerHTML = content;
        const msgContainer = document.getElementById('messages');
        msgContainer.appendChild(div);
        msgContainer.scrollTop = msgContainer.scrollHeight;
        return id;
    }

    function updateMessageHTML(id, content) {
        const el = document.getElementById(id);
        if (el) el.innerHTML = content;
    }
</script>

</body>
</html>
